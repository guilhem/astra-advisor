name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Jev SDK
        run: python3 -m pip install -r plugins/astra-advisor/requirements.txt
      - name: Verify Astra Advisor package
        run: sh plugins/astra-advisor/scripts/verify.sh
