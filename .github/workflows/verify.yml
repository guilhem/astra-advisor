name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify Codex Orchestrator package
        run: sh plugins/codex-orchestrator/scripts/verify.sh

  windows-profiles:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify automatic profile installation on Windows
        run: python -m unittest discover -s plugins/codex-orchestrator/tests -p test_install_routing_profiles.py
